name: Release

# Pushing a v* tag builds both cardndfixer.apk (standard release) and
# cardndfixer-debug.apk (debug build with log collector & simulator) and
# publishes them as release assets.
# A tag with a suffix (v0.2.0-beta.1, v0.2.0-rc.1) is published as a
# pre-release: it is never "latest". Its notes come from the "Unreleased"
# CHANGELOG section.
#
# For consistent release signing across updates, set repository secrets:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# If unset, the workflow signs the release APK with a temporary keystore so
# cardndfixer.apk remains directly installable.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build APKs for (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check that the tag matches versionName
        run: |
          version=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$TAG" ]; then
            echo "app/build.gradle.kts says $version but the tag is $TAG" >&2
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build release and debug APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release-keystore.jks
            export KEYSTORE_FILE="$PWD/release-keystore.jks"
          else
            keytool -genkeypair -v -keystore release-keystore.jks \
              -storepass cardndfixer -keypass cardndfixer \
              -alias cardndfixer -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=cardndfixer,O=Syxhen"
            export KEYSTORE_FILE="$PWD/release-keystore.jks"
            export KEYSTORE_PASSWORD="cardndfixer"
            export KEY_ALIAS="cardndfixer"
            export KEY_PASSWORD="cardndfixer"
          fi

          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/release/cardndfixer-release.apk cardndfixer.apk
          cp app/build/outputs/apk/debug/cardndfixer-debug.apk cardndfixer-debug.apk
          rm -f release-keystore.jks

      - name: Extract the release notes from CHANGELOG.md
        run: |
          case $TAG in *-*) v=Unreleased ;; *) v=${TAG#v} ;; esac
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {f = 1; next} /^## \[/ {f = 0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "No CHANGELOG section for $v" >&2; exit 1; }
          cat notes.md

      - name: Publish
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" cardndfixer.apk cardndfixer-debug.apk --clobber
          else
            case $TAG in *-*) pre=--prerelease ;; *) pre=--latest ;; esac
            gh release create "$TAG" cardndfixer.apk cardndfixer-debug.apk --verify-tag "$pre" \
              --title "cardndfixer ${TAG#v}" --notes-file notes.md
          fi
