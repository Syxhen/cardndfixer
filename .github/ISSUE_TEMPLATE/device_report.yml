name: Works on my phone & car
description: Tell us cardndfixer works on a phone, Android version, or car head unit
labels: [compatibility]
body:
  - type: input
    id: device
    attributes:
      label: Phone model and Android version
      placeholder: Pixel 9, Android 15
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Car connection type
      options: [Wired Android Auto, Wireless Android Auto, Car Bluetooth only, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: cardndfixer version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Delay settings that worked best, car head unit model, battery settings, etc.
